<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Login e Registro SmartXpress</title>
    <link rel="stylesheet" href="styleLoginRegistro.css">
</head>
<body>

    <div class="logotipo-container">
    <a href="../index.html">
      <img src="../Imagens/smartxpress_logo.svg" alt="Logo SmartXpress" class="logotipo">
    </a>
  </div>    
    <div class="container">
        <div class="form-box login">
            <form action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Usuário" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Senha" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p>ou faça login com a conta Google</p>
                <div class="social-icons">
                    <a href="#"><i class="bx bxl-google"></i></a>
                </div>
            </form>
        </div>

        <div class="form-box cadastro">
            <form action="">
                <h1>Cadastro</h1>
                <div class="input-box">
                    <input type="text" placeholder="Usuário" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="E-mail" required>
                    <i class="bx bxs-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Senha" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <button type="submit" class="btn">Cadastre-se</button>
                <p>ou faça cadastro com a conta Google</p>
                <div class="social-icons">
                    <a href="#"><i class="bx bxl-google"></i></a>

                </div>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Olá, bem vindo!</h1>
                <p>Não tem cadastro?</p>
                <button class="btn cadastro-btn">Cadastre-se</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Bem vindo de volta!</h1>
                <p>Já tem cadastro?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>


    <script src="scriptLogin.js"></script>
    
</body>
</html>
